name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          set +e
          python -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## unittest failed (python $MATRIX_PY)"
              echo '```'
              tail -n 120 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 失败用例名用注解抛出来，annotations API 能直接读到
            grep -E "^(FAIL|ERROR): " /tmp/test.log | head -n 12 | while IFS= read -r line; do
              echo "::error title=unittest($MATRIX_PY)::$line"
            done
            grep -E "^(AssertionError|[A-Za-z]+Error): " /tmp/test.log | head -n 6 | while IFS= read -r line; do
              echo "::error title=reason($MATRIX_PY)::$line"
            done
          fi
          exit "$status"
        env:
          MATRIX_PY: ${{ matrix.python-version }}
      - name: Check V2/V3 byte-for-byte parity
        run: |
          for dir in plugins.v2/*/; do
            name="$(basename "$dir")"
            diff -r "plugins.v2/$name" "plugins.v3/$name"
          done
          # 反向检查：V3 里也不能有 V2 缺失的插件目录
          for dir in plugins.v3/*/; do
            name="$(basename "$dir")"
            test -d "plugins.v2/$name"
          done
